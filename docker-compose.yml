services:
  ocr-web:
    container_name: ocr-web
    build: .
    restart: unless-stopped
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - medidok_share:/app/medidok
      # Development: Mount source code for hot-reload
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
      - ./routes:/app/routes
      - ./services:/app/services
      - ./templates:/app/templates
      - ./static:/app/static
    environment:
      - TZ=${TZ:-Europe/Berlin}
    stdin_open: true
    tty: true
    networks:
      - app-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  app-network:
    external: true
    name: ${DOCKER_NETWORK}

volumes:
  medidok_share:
    driver: local
    driver_opts:
      type: cifs
      device: "${SMB_SHARE}"
      # WICHTIG: iocharset=utf8 für korrekte Umlaute!
      o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=${SMB_VERS:-3.0},sec=${SMB_SEC:-ntlmssp},iocharset=utf8,uid=1000,gid=1000,file_mode=0777,dir_mode=0777"
